# Claim contexts of the example field (oktopy.contexts, oktopy.build_store).
# A claim's comparison text (lower case) is matched against `rules` in order; the first match gives its contrast code
# (claims/contrast_overrides.tsv takes precedence). Codes are those of config/contrasts.toml plus non-group codes
# (the stage covariate, `within`, `not_available`) labelled in [contrast_labels].

null_pattern = 'not significantly|no significant|not changed|unchanged|no difference|not (?:reduced|increased|altered|different|depleted|enriched)|comparable|did not differ|does not differ|no change|do not differ|do(?:es)? not change|no selective|\bno\b[^.;]{0,80}\b(?:changes|differs)\b'

rules = [
    ["late[- ]stage cases vs control", "late_vs_control"],
    ["^case vs control", "case_vs_control"],
    ["stage", "stage"],
    ["within|vs other|subpopulations|markers", "within"],
]

# a claim cell type -> the cell classes tested ("All": the pseudobulk of all cells); other cell types test themselves
[cell_class_expand]
All = ["ALL"]

# a claim region -> the harmonised dataset regions it covers
[region_map]
front = ["front"]
back = ["back"]

# contrast code -> [kind, case group, reference group]
[contrast_labels]
case_vs_control = ["case_control", "case", "control"]
late_vs_control = ["stage", "case, stage 2-3", "control"]
stage = ["continuous", "higher disease stage", "lower disease stage"]
within = ["within", "", ""]
not_available = ["not_available", "", ""]
"" = ["unassigned", "", ""]
