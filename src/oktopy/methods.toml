# Method registry of the oktopy engine: for every analysis task, the methods we run or could run, ranked into tiers.
#
#   primary      sets the verdict; one per task, fixed before results (today's engine method where one exists)
#   sensitivity  runs beside the primary; can only lower certainty (rating v3, not yet active)
#   exploratory  reported next to a claim, never rated
#   excluded     not run (except as the original-method diagnostic); the reason is published
#
# Ranking criteria, in order: (1) recommended practice: the single-cell best-practices book (`book`, chapter paths of
# https://www.sc-best-practices.org) or the scverse guides; (2) donor (or the field's replication unit) as the unit;
# (3) calibration under the null; (4) power and accuracy in independent benchmarks; (5) robustness to depth, cell
# numbers and batch; (6) assumptions different from the primary (sensitivity tier); (7) maintained, seeded,
# installable, preferably an scverse implementation.
#
# status: implemented (the engine runs it: `engine` names where) | planned
# serves: claim test templates (config/schema.toml [vocab] test_template) the method answers
# confidence (per task): high = independent benchmarks agree with the book; moderate; low = developer benchmarks or none
#
# Changes: a pull request that cites the source and what it measured; bump `version`; re-run the affected tests and
# diff the verdicts. A project may switch methods off in config/methods.toml ([disabled] ids = [...]), never promote.
# Render: oktopy registry --md OUT.md
# Sensitivity methods run beside the primary with `oktopy multiverse` (results/multiverse/); each must pass the
# shuffled-label check in a dataset before its result there counts (phase 7b).

version = "0.3.0"  # 0.3.0 (2026-11-20): first sensitivity methods implemented (phase 7b, oktopy.multiverse); 0.2.0 (2026-11-19): geneset.small primary is the donor score
reviewed = "2026-11-20"
book = "sc-best-practices 0.2.0 (2026-10-29)"
book_url = "https://www.sc-best-practices.org"
watch = [
    "sc-best-practices releases and CHANGELOG (https://github.com/theislab/single-cell-best-practices)",
    "sc-best-practices sections in preparation: imaging-based spatial QC (pull request 514); cell-cell communication across conditions (issue 408)",
    "scverse proteomics consortium guides (https://github.com/scverse/antibody-based-spatial-proteomics-guide)",
    "Open Problems living benchmark (https://openproblems.bio)",
]

# ---------------------------------------------------------------- single-cell and single-nucleus RNA

[task."de.case_control"]
title = "Differential expression between two donor groups"
modality = "rna"
book = "conditions/differential_gene_expression"
confidence = "high for excluding cell-level tests; moderate for pseudobulk over mixed models"
note = "Book: pseudobulk per donor and cell type with edgeR or DESeq2; covariates found by PCA of the pseudobulk; genes filtered per cell type. Benchmarks disagree on pseudobulk versus mixed models (Squair 2021, Junttila 2022, Murphy & Skene 2022 versus Zimmerman 2021)."

[[task."de.case_control".method]]
id = "edger_ql"
tier = "primary"
status = "implemented"
engine = "de_cache.R fit_one: glmQLFit ~ group + age + sex + pmi, filterByExpr per region x class"
serves = ["de_pseudobulk"]
unit = "donor x region x class pseudobulk"
requires = ["raw counts", ">= 3 units per group"]
evidence = ["sc-best-practices: conditions/differential_gene_expression", "Squair 2021 Nat Commun", "Crowell 2020 Nat Commun", "Junttila 2022 Brief Bioinform", "Murphy & Skene 2022 Nat Commun"]
why = "recommended by the book; donor is the unit; pseudobulk keeps false discoveries controlled in independent benchmarks"

[[task."de.case_control".method]]
id = "deseq2"
tier = "sensitivity"
status = "implemented"
engine = "de_sensitivity.R deseq2: Wald test on the DE cache's model matrix and genes, no independent filtering"
serves = ["de_pseudobulk"]
unit = "donor x region x class pseudobulk"
evidence = ["sc-best-practices: conditions/differential_gene_expression", "Squair 2021 Nat Commun"]
why = "named by the book beside edgeR; different dispersion shrinkage"

[[task."de.case_control".method]]
id = "limma_voom"
tier = "sensitivity"
status = "implemented"
engine = "de_sensitivity.R limma_voom: voom, lmFit, eBayes(robust) on the DE cache's design and genes"
serves = ["de_pseudobulk"]
unit = "donor x region x class pseudobulk"
evidence = ["Squair 2021 Nat Commun", "Crowell 2020 Nat Commun"]
why = "different variance model (precision weights on log-CPM)"

[[task."de.case_control".method]]
id = "dreamlet"
tier = "sensitivity"
status = "planned"
serves = ["de_pseudobulk"]
unit = "donor random effect over pseudobulk units"
requires = ["dreamlet and variancePartition (Bioconductor), not in the engine's R environment"]
evidence = ["Hoffman 2026 Nat Commun", "Zimmerman 2021 Nat Commun"]
why = "mixed model on pseudobulk: pools several regions per donor; precision weights handle unequal nuclei counts"

[[task."de.case_control".method]]
id = "nebula"
tier = "sensitivity"
status = "planned"
serves = ["de_pseudobulk"]
unit = "cells with a donor random effect"
requires = ["run on the claim's genes only (compute)", "nebula (CRAN), not in the engine's R environment"]
evidence = ["He 2021 Commun Biol", "Zimmerman 2021 Nat Commun", "Junttila 2022 Brief Bioinform"]
why = "the other side of the pseudobulk versus mixed-model debate; valid unit"

[[task."de.case_control".method]]
id = "wilcoxon_pseudobulk"
tier = "sensitivity"
status = "implemented"
engine = "de_sensitivity.R wilcoxon: rank-sum per gene on TMM-normalised CPM, BH; no covariates"
serves = ["de_pseudobulk"]
unit = "donor log-CPM"
requires = ["large cohorts, where the shuffled-label check shows parametric models losing control"]
evidence = ["Li Y 2022 Genome Biol"]
why = "keeps false discoveries controlled at population-scale sample sizes"

[[task."de.case_control".method]]
id = "cell_level_tests"
tier = "excluded"
status = "planned"
serves = ["de_pseudobulk"]
unit = "cells, no donor effect"
evidence = ["Squair 2021 Nat Commun", "Junttila 2022 Brief Bioinform", "Murphy 2023 eLife"]
why = "treats cells as replicates: hundreds of false discoveries; run only as the original-method diagnostic"

