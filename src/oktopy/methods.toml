[task."geneset.small"]
title = "Two to four named genes"
modality = "rna"
book = "conditions/gsea_pathway"
confidence = "moderate"
note = "Book: competitive tests preferred. But the random-gene competitive test ignores correlation between the named genes (Wu & Smyth 2012), and under shuffled case/control labels it gave p < 0.05 in 10-16% of 2-4-gene tests (phase 7a, 2026-11-19). The donor score gave 2.6-5.6% (1.2% with 7 donors), so it is the primary from phase 7a; [tests] min_score_genes sets the threshold (default 2, 5 before)."

[[task."geneset.small".method]]
id = "donor_score"
tier = "primary"
status = "implemented"
engine = "retest.donor_score_test: per-unit mean of sign x z-scored log-CPM, Mann-Whitney (Spearman for the stage)"
serves = ["de_pseudobulk", "geneset_shift", "state_signature"]
unit = "donor x region x class pseudobulk"
evidence = ["phase 7a shuffled-label calibration: results/robustness/calibration_summary.tsv", "Goeman & Buehlmann 2007 Bioinformatics"]
why = "donors as the unit; respects correlation between genes; calibrated at 2-4 genes in 23 datasets"

[[task."geneset.small".method]]
id = "random_set_competitive"
tier = "excluded"
status = "implemented"
engine = "retest.gene_set_test: mean oriented z against 2000 random gene sets of the same size"
serves = ["de_pseudobulk", "geneset_shift", "state_signature"]
unit = "edgeR z of donor pseudobulk"
evidence = ["phase 7a shuffled-label calibration: results/robustness/calibration_summary.tsv", "Wu & Smyth 2012 Nucleic Acids Res"]
why = "liberal: 10-16% of 2-4-gene null tests at p < 0.05; the primary before phase 7a, used only if a project sets min_score_genes above 2"

[[task."geneset.small".method]]
id = "camera"
tier = "sensitivity"
status = "implemented"
engine = "de_sensitivity.R limma_voom + camera: genes expected down sign-flipped, inter-gene correlation estimated per set"
serves = ["de_pseudobulk", "geneset_shift", "state_signature"]
unit = "donor pseudobulk"
evidence = ["Wu & Smyth 2012 Nucleic Acids Res"]
why = "competitive test that allows for correlation between genes"

[[task."geneset.small".method]]
id = "donor_score_adjusted"
tier = "sensitivity"
status = "implemented"
engine = "multiverse.adjusted_score_test: the donor score in a linear model with the DE cache's covariates, t-test"
serves = ["de_pseudobulk", "geneset_shift", "state_signature"]
unit = "donor x region x class pseudobulk"
evidence = ["sc-best-practices: conditions/differential_gene_expression"]
why = "same score, parametric and adjusted for age, sex and PMI as the DE model is; the primary is rank-based and unadjusted"

[[task."geneset.small".method]]
